[project]
name = "gitmem"
version = "0.1.0"
description = "Git as the storage and operation log for LLM agent memory"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastembed>=0.8.0", "numpy>=2.5.0"]

[project.scripts]
gitmem = "gitmem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitmem"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.ruff]
line-length = 100
